[project]
name = "customer-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zain", email = "zaintamer10@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=0.26.0",
    "onnxruntime>=1.22.0",
    "optimum-onnx>=0.0.3",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "seaborn>=0.13.2",
    "torch>=2.14.0",
    "transformers[torch]>=4.57.6",
]

[project.scripts]
customer-service = "customer_service.predict_intent:main"
retrain-intent-classifier = "customer_service.retrain_intent:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
modeling = [
    "accelerate>=1.10.0",
    "fastparquet>=2026.5.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.6",
    "numpy>=2.5.3",
    "onnx>=1.19.0",
    "onnxruntime>=1.22.0",
    "optimum-onnx>=0.0.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.8.0",
    "transformers>=4.56.0",
]
preprocessing = [
    "fastparquet>=2026.5.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.6",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pip>=26.2.1",
    "scikit-learn>=1.9.0",
]
